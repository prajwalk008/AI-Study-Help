# Deploy backend/ to Azure App Service (recall, B1 Linux).
# Docs: https://github.com/Azure/webapps-deploy
#
# GitHub secret required:
#   AZURE_WEBAPP_PUBLISH_PROFILE — Azure Portal → recall → Download publish profile

name: Build and deploy Python app to Azure Web App - recall

on:
  push:
    branches:
      - azure-deploy
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (sanity check)
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: recall
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

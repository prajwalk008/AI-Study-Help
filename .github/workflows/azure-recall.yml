# Deploy backend/ to Azure App Service (recall, B1 Linux).
# Auth: publish profile secret (AZURE_WEBAPP_PUBLISH_PROFILE).
# Portal one-time setup: startup command + app settings (see backend/startup.sh header).

name: Build and deploy Python app to Azure Web App - recall

on:
  push:
    branches:
      - azure-deploy
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: recall

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (sanity check)
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Remove local venv from artifact
        run: rm -rf antenv

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          startup-command: 'bash $APP_PATH/startup.sh'

      - name: Smoke test health endpoint
        run: |
          URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"
          echo "Waiting for $URL ..."
          for i in $(seq 1 45); do
            if curl -sf "$URL"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i/45 — not ready yet"
            sleep 20
          done
          echo "Health check timed out. Check App Service logs." >&2
          exit 1

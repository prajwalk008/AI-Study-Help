name: Deploy Recall backend

on:
  pull_request:
    branches: [master]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/deploy-backend.yml
  push:
    branches: [master]
    paths:
      - backend/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: recall-backend-production
  cancel-in-progress: false

env:
  ACR_NAME: recallacr1073405515
  API_IMAGE: recallacr1073405515.azurecr.io/backend:${{ github.sha }}
  WORKER_IMAGE: recallacr1073405515.azurecr.io/ingest-worker:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check frontend types
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit --incremental false

      - name: Build API and worker images
        run: |
          docker build -t "$API_IMAGE" backend
          docker build --build-arg BASE_IMAGE="$API_IMAGE" \
            -f backend/Dockerfile.worker -t "$WORKER_IMAGE" backend

      - name: Start storage emulator
        run: |
          docker compose -f backend/docker-compose.test.yml up -d
          for attempt in {1..30}; do
            if curl -s -o /dev/null 'http://127.0.0.1:11000/devstoreaccount1?comp=list' && \
               curl -s -o /dev/null 'http://127.0.0.1:11001/devstoreaccount1?comp=list'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Test Blob and Queue ingestion
        env:
          RECALL_TEST_AZURITE: "1"
          AZURE_STORAGE_CONNECTION_STRING: >-
            DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:11000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:11001/devstoreaccount1
        run: |
          docker run --rm --network host \
            --mount "type=bind,source=$PWD/backend/tests,target=/app/tests,readonly" \
            -e RECALL_TEST_AZURITE \
            -e AZURE_STORAGE_CONNECTION_STRING \
            "$API_IMAGE" python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test upload and worker flow
        env:
          INTERNAL_API_SECRET: recall-local-test-secret
          RECALL_TEST_LOCAL_SERVICES: "1"
          AZURE_STORAGE_CONNECTION_STRING: >-
            DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:11000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:11001/devstoreaccount1
        run: |
          docker run -d --name recall-test-api --network host \
            --mount "type=bind,source=$PWD/backend/tests,target=/app/tests,readonly" \
            -e INTERNAL_API_SECRET -e AZURE_STORAGE_CONNECTION_STRING \
            -e RECALL_TEST_PORT=18000 \
            "$API_IMAGE" python tests/fixture_worker_entry.py
          for attempt in {1..30}; do
            if curl -fsS 'http://127.0.0.1:18000/api/health' > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS 'http://127.0.0.1:18000/api/health' > /dev/null
          docker run --rm --network host \
            --mount "type=bind,source=$PWD/backend/tests,target=/app/tests,readonly" \
            -e RECALL_TEST_LOCAL_SERVICES \
            "$API_IMAGE" python -m unittest -v tests.test_local_services

      - name: Stop storage emulator
        if: always()
        run: |
          docker rm -f recall-test-api || true
          docker compose -f backend/docker-compose.test.yml down

      - name: Sign in to Azure
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: 36c8c4b5-923d-43be-8113-fe1d2fa77f28
          tenant-id: 25d7ca0a-58be-48d8-abb6-00cb9319ffe3
          subscription-id: 1b0a96ec-8fc3-487b-b124-10b4c1956a71

      - name: Push images to Azure Container Registry
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$API_IMAGE"
          docker push "$WORKER_IMAGE"

      - name: Update on-demand worker job
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          az containerapp job update \
            --name recall-ingest-worker \
            --resource-group recall-rg \
            --image "$WORKER_IMAGE" \
            --output none
          deployed=$(az containerapp job show \
            --name recall-ingest-worker --resource-group recall-rg \
            --query 'properties.template.containers[0].image' --output tsv)
          test "$deployed" = "$WORKER_IMAGE"

      - name: Update Container App
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          az containerapp update \
            --name recall-backend \
            --resource-group recall-rg \
            --image "$API_IMAGE" \
            --min-replicas 0 \
            --max-replicas 2 \
            --set-env-vars \
              AZURE_STORAGE_CONNECTION_STRING=secretref:azure-storage \
              AZURE_BLOB_CONTAINER=recall-uploads \
              AZURE_QUEUE_NAME=recall-ingest \
              BUILD_SHA="$GITHUB_SHA" \
            --output none

      - name: Verify the new revision is serving traffic
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          host=$(az containerapp show --name recall-backend --resource-group recall-rg \
            --query properties.configuration.ingress.fqdn --output tsv)
          for attempt in {1..30}; do
            if curl -fsS --max-time 10 "https://$host/api/health" | \
              jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .build_sha == $sha' > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'New backend revision did not pass the health check.' >&2
          exit 1

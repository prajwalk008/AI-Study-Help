name: Build Recall images for staging

on:
  push:
    branches:
      - ghcr-integration
    paths:
      - backend/**
      - .github/workflows/deploy-backend-staging.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/prajwalk008/recall-backend:${{ github.sha }}
  WORKER_IMAGE: ghcr.io/prajwalk008/recall-ingest-worker:${{ github.sha }}
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  API_IMAGE: ghcr.io/prajwalk008/recall-backend:${{ github.sha }}
  WORKER_IMAGE: ghcr.io/prajwalk008/recall-ingest-worker:${{ github.sha }}

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/ghcr-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Build API image
        run: docker build -t "$API_IMAGE" backend

      - name: Build ingestion worker image
        run: |
          docker build \
            --build-arg BASE_IMAGE="$API_IMAGE" \
            -f backend/Dockerfile.worker \
            -t "$WORKER_IMAGE" backend

      - name: Push images to GHCR
        run: |
          docker push "$API_IMAGE"
          docker push "$WORKER_IMAGE"